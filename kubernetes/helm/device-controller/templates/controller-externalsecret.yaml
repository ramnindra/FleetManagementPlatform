{{- if .Values.controller.secrets.useExternalSecrets }}
# Staging/prod: pulls real secret values from AWS Secrets Manager at runtime.
# Requires the External Secrets Operator (https://external-secrets.io) to
# already be installed in the cluster and a SecretStore named
# {{ .Values.controller.externalSecrets.secretStoreRef }} to exist — both are
# cluster-wide prerequisites set up once by Terraform/platform tooling, not by
# this application chart. The ARNs/paths below are the ones Terraform's
# aws_secretsmanager_secret resources create — see
# infrastructure/terraform (Phase 6).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "device-controller.fullname" . }}-secrets
  namespace: {{ include "device-controller.namespace" . }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.controller.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "device-controller.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: CONTROLLER_DATABASE_URL
      remoteRef:
        key: {{ .Values.controller.externalSecrets.remoteRefPrefix }}/database-url
    - secretKey: CONTROLLER_MQTT_CLIENT_PASSWORD
      remoteRef:
        key: {{ .Values.controller.externalSecrets.remoteRefPrefix }}/mqtt-client-password
    - secretKey: CONTROLLER_MQTT_WEBHOOK_SHARED_SECRET
      remoteRef:
        key: {{ .Values.controller.externalSecrets.remoteRefPrefix }}/mqtt-webhook-shared-secret
    - secretKey: CONTROLLER_ADMIN_API_KEY
      remoteRef:
        key: {{ .Values.controller.externalSecrets.remoteRefPrefix }}/admin-api-key
{{- end }}
