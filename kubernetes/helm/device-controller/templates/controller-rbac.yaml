# The controller never calls the Kubernetes API — it only talks to Postgres
# and MQTT. This ServiceAccount + Role + RoleBinding are deliberately
# zero-permission: an explicit, auditable "this workload has no cluster
# access" rather than relying on the implicit deny you'd get from simply not
# creating a ServiceAccount at all. automountServiceAccountToken is also off,
# so the pod does not even carry a token it would never use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "device-controller.fullname" . }}-controller
  namespace: {{ include "device-controller.namespace" . }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "device-controller.fullname" . }}-controller
  namespace: {{ include "device-controller.namespace" . }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "device-controller.fullname" . }}-controller
  namespace: {{ include "device-controller.namespace" . }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "device-controller.fullname" . }}-controller
    namespace: {{ include "device-controller.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "device-controller.fullname" . }}-controller
  apiGroup: rbac.authorization.k8s.io
