{{- if not .Values.controller.secrets.useExternalSecrets }}
# Local/dev only: secret values come straight from Helm values (plaintext in
# values-dev.yaml). Never do this for staging/prod — see
# controller-externalsecret.yaml, used instead when
# controller.secrets.useExternalSecrets is true.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "device-controller.fullname" . }}-secrets
  namespace: {{ include "device-controller.namespace" . }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
type: Opaque
stringData:
  CONTROLLER_DATABASE_URL: {{ .Values.controller.secrets.databaseUrl | quote }}
  CONTROLLER_MQTT_CLIENT_PASSWORD: {{ .Values.controller.secrets.mqttClientPassword | quote }}
  CONTROLLER_MQTT_WEBHOOK_SHARED_SECRET: {{ .Values.controller.secrets.mqttWebhookSharedSecret | quote }}
  CONTROLLER_ADMIN_API_KEY: {{ .Values.controller.secrets.adminApiKey | quote }}
{{- end }}
