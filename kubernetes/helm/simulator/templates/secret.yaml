{{- if not .Values.controller.existingAdminKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    app.kubernetes.io/name: simulator
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  admin-api-key: {{ .Values.controller.adminApiKey | quote }}
{{- end }}
