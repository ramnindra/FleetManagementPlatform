# Local/dev EMQX configuration. Delegates both authentication and
# authorization to the controller's /internal/mqtt/* webhooks so device
# identity has a single source of truth (the controller's Postgres-backed
# device table) instead of being duplicated into EMQX's own user DB.
#
# Dev-only shortcut: the controller<->EMQX link is secured with a static
# shared-secret header (CONTROLLER_MQTT_WEBHOOK_SHARED_SECRET), not mTLS.
# Production hardening (see docs/architecture.md section 12) should move this
# to mutual TLS between EMQX and the controller.

node {
  name = "emqx@127.0.0.1"
  cookie = "dev-only-emqx-cookie-not-a-secret"
  data_dir = "/opt/emqx/data"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 2000000
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://controller:8000/internal/mqtt/auth"
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    headers {
      "Content-Type" = "application/json"
      # Matches CONTROLLER_MQTT_WEBHOOK_SHARED_SECRET in docker-compose.yml.
      # HOCON only substitutes the %-style request variables above
      # (${username}, ${clientid}, ...), not arbitrary OS env vars, so this
      # value is set literally here for local/dev. In Helm/Terraform
      # environments this is templated from the same Secrets Manager value
      # the controller reads, never hardcoded — see kubernetes/helm.
      "X-Webhook-Secret" = "change-me-webhook-secret"
    }
    # pool_size = 8 (the EMQX default) measurably bottlenecked a 1,000-device
    # connection burst: EMQX could only have 8 auth webhook calls in flight
    # at once, so most of 1,000 near-simultaneous CONNECTs queued behind that
    # and timed out waiting for a free pool slot — see
    # docs/load-test-report.md. Sized to comfortably exceed this project's
    # 1,000-device target with headroom, not to some theoretical maximum.
    pool_size = 64
    connect_timeout = "5s"
    request_timeout = "10s"
  }
]

authorization {
  no_match = deny
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://controller:8000/internal/mqtt/acl"
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      headers {
        "Content-Type" = "application/json"
        "X-Webhook-Secret" = "change-me-webhook-secret"
      }
      pool_size = 64 # see the authentication pool_size comment above
      connect_timeout = "5s"
      request_timeout = "10s"
    }
  ]
}
